# Si el navegador pide pasar a WebSocket, se lo decimos también al backend
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # /api/... se reenvía a FastAPI quitando el prefijo: /api/users -> backend:8000/users
    # Los WebSockets (/api/ws/...) pasan por aquí también.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo lo demás es la app de React. Si la ruta no es un archivo real
    # (por ejemplo /chat), devolvemos index.html y React Router decide qué pintar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
